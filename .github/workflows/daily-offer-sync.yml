name: Finance refresh health (actual refresh runs in Supabase Cron)
on:
  schedule:
    - cron: '10 5 * * *' # 10:40 IST, after 10:10 IST refresh
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check recorded daily attempts without accessing credentials
        run: node scripts/verify-finance-health.mjs
