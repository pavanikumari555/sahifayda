name: Public sitemap availability (not search submission)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public sitemap responds
        run: curl --fail --show-error --silent https://sahifayda.pages.dev/sitemap.xml -o sitemap.xml
      - name: Verify bilingual calculator URLs
        run: grep -q '/hi/cashback-discount-calculator/' sitemap.xml
